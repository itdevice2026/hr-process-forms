<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Process Forms</title>
<style>
:root{
  --red:#c8102e; --red-d:#9e0c24; --red-50:#fdecef;
  --ink:#1b1f24; --ink-2:#4a5260; --ink-3:#7a8394;
  --line:#e3e6eb; --bg:#f5f6f8; --card:#fff;
  --ok:#1f7a3f; --ok-50:#e7f5ec; --warn:#a36200; --warn-50:#fff4e0; --bad:#b42318; --bad-50:#fdeceb; --info:#1d4ed8; --info-50:#e8efff;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--red);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* layout */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.brand img{width:30px;height:30px;object-fit:contain}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:11px;letter-spacing:0}
.topbar .sp{flex:1}
.who{font-size:13px;color:var(--ink-2);text-align:right;line-height:1.2}
.who b{color:var(--ink)}
.menu-btn{display:none;border:0;background:none;font-size:22px;padding:4px 8px;cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 56px)}
.side{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:12px 10px}
.side h6{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3)}
.side a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--red-50);color:var(--red-d)}
.badge{min-width:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;text-align:center;line-height:18px}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1280px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink-3);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}

/* tiles */
.tile{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);transition:.15s}
.tile:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(200,16,46,.08)}
.tile .ic{width:36px;height:36px;border-radius:9px;background:var(--red-50);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:12px;margin-bottom:10px}
.tile b{display:block}
.tile span{font-size:12px;color:var(--ink-3)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-size:26px;font-weight:700}
.stat .l{font-size:12px;color:var(--ink-3)}

/* forms */
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;padding:8px 10px;border:1px solid #cfd4dc;border-radius:8px;background:#fff;min-height:36px}
.in:focus{outline:2px solid rgba(200,16,46,.25);border-color:var(--red)}
textarea.in{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid #cfd4dc;background:#fff;cursor:pointer;font-weight:600;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f0b8b3}
.btn.sm{padding:4px 10px;min-height:28px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#fafbfc;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#fafbfc}
table.t .num{text-align:right}
table.ed td{padding:5px 6px} table.ed .in{min-height:32px;padding:5px 7px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.st-pending{background:var(--warn-50);color:var(--warn)}
.st-approved{background:var(--ok-50);color:var(--ok)}
.st-rejected{background:var(--bad-50);color:var(--bad)}
.st-returned{background:var(--info-50);color:var(--info)}
.st-cancelled{background:#eef0f3;color:var(--ink-3)}
.st-waiting{background:#eef0f3;color:var(--ink-3)}
.st-skipped{background:#eef0f3;color:var(--ink-3)}

.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:#eef0f3;color:var(--ink-3)}
.step.approved .dot{background:var(--ok);color:#fff}
.step.pending .dot{background:var(--warn);color:#fff}
.step.rejected .dot,.step.returned .dot{background:var(--bad);color:#fff}
.step small{color:var(--ink-3)}
.log{font-size:12px;color:var(--ink-2)}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border:0}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:100%;max-width:380px;padding:26px}
.login .brand{justify-content:center;margin-bottom:18px;flex-direction:column;text-align:center}
.login .brand img{width:56px;height:56px}
.msg{padding:9px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.msg.err{background:var(--bad-50);color:var(--bad)}
.msg.ok{background:var(--ok-50);color:var(--ok)}
.msg.info{background:var(--info-50);color:var(--info)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1b1f24;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#toast div.err{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  #dgrid{grid-template-columns:1fr!important}
  .g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .menu-btn{display:block}
  .side{position:fixed;top:56px;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:.2s;box-shadow:4px 0 20px rgba(0,0,0,.1)}
  .side.open{transform:none}
  main{padding:16px}
  .who span{display:none}
}
@media (max-width:560px){ .g2,.g3,.g4,.g5{grid-template-columns:1fr} .kv{grid-template-columns:110px 1fr} }

/* ================= PRINT (paper forms) ================= */
#print-root{display:none}
@media print{
  @page{size:letter;margin:0}
  html,body{background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
}
.pp{position:relative;width:8.5in;height:11in;overflow:hidden;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;page-break-after:always;break-after:page}
.pp:last-child{page-break-after:auto;break-after:auto}
.pp *{box-sizing:border-box}
.pc{position:absolute;border:1px solid #000}
.pc table{border-collapse:collapse;table-layout:fixed;width:100%}
.pc td{border:1px solid #000;padding:0 2px;overflow:hidden;white-space:nowrap;vertical-align:middle;font-size:6.6pt}
.pc .lb{font-weight:700;vertical-align:top;padding-top:2px}
.pc .val{font-weight:400;margin-left:4px}
.pc .hd td{font-weight:700;text-align:center}
.pc .sp-l{letter-spacing:2.5pt}
.pc .cell{text-align:center}
.pc .wrap{white-space:normal;vertical-align:top;padding:3px 4px;line-height:1.25}
.pc .nb{border:0}
.pco{position:absolute;font-size:5.5pt;font-weight:700;font-style:italic}
.pref{position:absolute;font-size:5.5pt;color:#444}
.co{position:relative;height:100%}
.co img{position:absolute;object-fit:contain}
.co .cn{position:absolute;font-weight:700;white-space:nowrap}
.co .ca{position:absolute;white-space:nowrap}
.ab{position:absolute;white-space:nowrap}
.sl{position:absolute;border-top:1px solid #000;text-align:center;font-weight:700;font-style:italic;white-space:nowrap}
.sv{position:absolute;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden}
.sv i{font-weight:400;font-style:normal;font-size:.8em}
.ptitle{font-weight:700;text-align:center;white-space:nowrap}

</style>

<script>
/* ===== Paper-form print engine: replicates the MTC sample forms (Letter, HR Copy + Employee Copy) ===== */
const PX = 110;                       // reference scale: sample PDFs rendered at 110 px/in
const U = n => Math.round(n * 96 / PX) + 'px';   // whole CSS px keeps every ruled line the same weight
const PT = n => n + 'pt';

function pDate(s){ if(!s) return ''; const [y,m,d]=String(s).slice(0,10).split('-'); return `${m}/${d}/${y}`; }
function pTime(s){ if(!s) return ''; let [h,m]=String(s).split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; }
function pTs(ts){ if(!ts) return ''; const d=new Date(ts); return d.toLocaleDateString('en-US',{timeZone:'Asia/Manila',month:'2-digit',day:'2-digit',year:'numeric'}); }
function pe(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* signature values (printed name over the line) */
function sigs(d){
  const a = d.approvals || [];
  const pick = slot => { const done = a.filter(x=>x.print_slot===slot && x.status==='approved'); return done[done.length-1]; };
  const ap = pick('approved'), rc = pick('received');
  return {
    prepared: { name: d.req.emp_name, date: pDate(d.req.date_filed) },
    approved: ap ? { name: ap.acted_by_name, date: pTs(ap.acted_at) } : null,
    received: rc ? { name: rc.acted_by_name, date: pTs(rc.acted_at) } : null,
  };
}
function sv(v, left, width, lineTop, fs){
  if(!v || !v.name) return '';
  return `<div class="sv" style="left:${U(left)};width:${U(width)};top:${U(lineTop-13)};font-size:${PT(fs)}">${pe(v.name)} <i>${pe(v.date||'')}</i></div>`;
}
function sline(left, width, top, caption, fs){
  return `<div class="sl" style="left:${U(left)};width:${U(width)};top:${U(top)};font-size:${PT(fs)}">${caption}</div>`;
}
function abs(left, top, html, style=''){ return `<div class="ab" style="left:${U(left)};top:${U(top)};${style}">${html}</div>`; }
function colgroup(ws){ return '<colgroup>' + ws.map(w=>`<col style="width:${U(w)}">`).join('') + '</colgroup>'; }
function lv(label, value){ return `<span class="lb-t">${label}</span><span class="val">${pe(value||'')}</span>`; }

function companyHead(co, g){
  // g: {logo:[l,t,s], name:[l,t,fs], addr:[l,t,fs]}
  return `<div class="co" style="${g.h?'height:'+U(g.h):''}">
    <img src="${co.logo || window.DEFAULT_LOGO}" style="left:${U(g.logo[0])};top:${U(g.logo[1])};width:${U(g.logo[2])};height:${U(g.logo[2])}">
    <div class="cn" style="left:${U(g.name[0])};top:${U(g.name[1])};font-size:${PT(g.name[2])}">${pe(co.name)}</div>
    <div class="ca" style="left:${U(g.addr[0])};top:${U(g.addr[1])};font-size:${PT(g.addr[2])}">${pe(co.address)}</div>
  </div>`;
}
function copyLabel(left, top, txt, ref){
  return `<div class="pco" style="left:${U(left)};top:${U(top)}">${txt}</div>` +
         (ref ? `<div class="pref" style="left:${U(left+200)};top:${U(top)}">Ref. No. ${pe(ref)}</div>` : '');
}
function hrsOf(l){ // used by reports
  if(!l.time_from||!l.time_to) return null;
  const t=s=>{const [h,m]=s.split(':').map(Number);return h*60+m;};
  let m=t(l.time_to)-t(l.time_from); if(m<0) m+=1440; return Math.round(m/6)/10;
}

/* ---------- LEAVE OF ABSENCE FORM ---------- */
function pLeave(d, top, copy){
  const W=779, H=461, cols=[95,95,84,84,84,84,253], rh=102/7;
  const s=sigs(d), req=d.req, rows=d.lines;
  let body='';
  for(let i=0;i<7;i++){
    const l=rows[i]||{};
    body+=`<tr style="height:${U(rh)}">
      <td class="cell">${pe(l.leave_type||'')}</td>
      <td class="cell">${l.leave_type? (l.with_pay?'With Pay':'Without Pay') : ''}</td>
      <td class="cell">${pDate(l.date_from)}</td><td class="cell">${pDate(l.date_to)}</td>
      <td class="cell">${pTime(l.time_from)}</td><td class="cell">${pTime(l.time_to)}</td>
      ${i===0?`<td rowspan="7" class="wrap" style="font-size:6.6pt">${pe(req.reason||'')}</td>`:''}
    </tr>`;
  }
  const lts = (d.leaveTypes||[]).filter(x=>x.active);
  const legend = lts.map((x,i)=>
      abs(560, 45+i*14.7, pe(x.code), `width:${U(48)};text-align:right;font-size:6.6pt`) +
      abs(612, 45+i*14.7, '&nbsp;- '+pe(x.name), 'font-size:6.6pt')).join('');
  const noteTop = Math.max(119, 45 + lts.length*14.7 + 14);
  const foot = `<div class="co" style="height:${U(191)}">
    ${abs(0,16,'Prepared by:',`width:${U(92)};text-align:right;font-size:6.6pt`)}
    ${sv(s.prepared,190,251,43,7)}${sline(190,251,43,'Signature Over Printed Name of Employee',6.6)}
    ${abs(0,74,'Approved by:',`width:${U(92)};text-align:right;font-size:7.2pt`)}
    ${sv(s.approved,190,168,102,7)}${sline(190,168,102,'Immediate Head/Manager',6.6)}
    ${abs(0,148,'Received by:',`width:${U(92)};text-align:right;font-size:6.6pt`)}
    ${sv(s.received,190,168,176,7)}${sline(190,168,176,'Human Resources',6.6)}
    ${abs(526,16,'Type of Leave',`width:${U(253)};text-align:center;font-weight:700;font-size:6.6pt`)}
    ${abs(528,30,'Leave Legend:','font-size:6.6pt')}
    ${legend}
    ${abs(528,noteTop,'Note:','font-weight:700;font-size:6.6pt')}
    ${abs(528,noteTop+27,'Please attach needed attachment/s, example:<br>Medical Certificate.','font-size:6.6pt;white-space:normal;width:'+U(240)+';line-height:1.35')}
  </div>`;
  return `<div class="pc" style="left:${U(78)};top:${U(top)};width:${U(W)};height:${U(H)};border:0">
   <table>${colgroup(cols)}
    <tr style="height:${U(46)}"><td colspan="7" style="padding:0;border-bottom:1px solid #000">${companyHead(d.company,{h:46,logo:[30,12,22],name:[97,8,7.6],addr:[99,32,6.5]})}</td></tr>
    <tr style="height:${U(29)}"><td colspan="7" class="ptitle" style="font-size:10pt">${pe(d.form.title)}</td></tr>
    <tr style="height:${U(30)}"><td colspan="4" class="lb">${lv('Name:',req.emp_name)}</td><td colspan="2" class="lb">${lv('Date Filed:',pDate(req.date_filed))}</td><td class="lb">${lv('Date Hired:',pDate(req.emp_date_hired))}</td></tr>
    <tr style="height:${U(31)}"><td colspan="4" class="lb">${lv('Position/Job Title:',req.emp_position)}</td><td colspan="2" class="lb">${lv('Department:',req.emp_department)}</td><td></td></tr>
    <tr class="hd" style="height:${U(17)}"><td rowspan="2">TYPE OF LEAVE</td><td rowspan="2" style="white-space:normal;line-height:1.15">WITH PAY/<br>WITHOUT PAY</td><td colspan="2" class="sp-l" style="font-size:7.5pt">DATE</td><td colspan="2" class="sp-l" style="font-size:7.5pt">TIME</td><td rowspan="2" style="font-size:8.5pt">REASON</td></tr>
    <tr class="hd" style="height:${U(15)}"><td style="font-size:7pt">FROM</td><td style="font-size:7pt">TO</td><td style="font-size:7pt">FROM</td><td style="font-size:7pt">TO</td></tr>
    ${body}
    <tr style="height:${U(191)}"><td colspan="7" style="padding:0;vertical-align:top">${foot}</td></tr>
   </table></div>
   ${copyLabel(80, top+H+10, copy, req.ref_no)}`;
}

/* ---------- REQUEST FOR OVERTIME / UNDERTIME ---------- */
function pOtUt(d, top, copy){
  const W=645, H=484, s=sigs(d), req=d.req;
  let grid='';
  for(let i=0;i<10;i++){
    const l=d.lines[i]||{};
    grid+=`<tr style="height:${U(17)}"><td class="cell">${pDate(l.date_from)}</td><td class="cell">${pTime(l.time_from)}</td><td class="cell">${pTime(l.time_to)}</td><td style="font-size:6.8pt">${pe(l.reason||'')}</td></tr>`;
  }
  return `<div class="pc" style="left:${U(78)};top:${U(top)};width:${U(W)};height:${U(H)}">
    ${companyHead(d.company,{logo:[44,16,32],name:[106,19,8.6],addr:[108,39,7.4]})}
    <div class="ab ptitle" style="left:0;width:100%;top:${U(75)};font-size:12.5pt">${pe(d.form.title)}</div>
    <table style="position:absolute;left:${U(34)};top:${U(105)};width:${U(581)}">${colgroup([265,316])}
      <tr style="height:${U(36)}"><td class="lb" style="font-size:7.6pt">${lv('Name:',req.emp_name)}</td><td class="lb" style="font-size:7.6pt">${lv('Date Filed:',pDate(req.date_filed))}</td></tr>
      <tr style="height:${U(36)}"><td class="lb" style="font-size:7.6pt">${lv('Position/Job Title:',req.emp_position)}</td><td class="lb" style="font-size:7.6pt">${lv('Department:',req.emp_department)}</td></tr>
    </table>
    <table style="position:absolute;left:${U(34)};top:${U(194)};width:${U(581)}">${colgroup([69,109,87,316])}
      <tr class="hd" style="height:${U(17)}"><td style="font-size:7pt">DATE</td><td style="font-size:7pt">START TIME</td><td style="font-size:7pt">END TIME</td><td style="font-size:7pt">REASON/PURPOSE</td></tr>
      ${grid}
    </table>
    ${abs(37,400,'Requested by:','font-weight:700;font-size:7.4pt')}
    ${abs(231,400,'Approved by:','font-weight:700;font-size:7.4pt')}
    ${abs(426,400,'Received by:','font-weight:700;font-size:7.4pt')}
    ${sv(s.prepared,34,178,450,7.4)}${sline(34,178,450,'Signature Over Printed Name',7.4)}
    ${sv(s.approved,228,180,450,7.4)}${sline(228,180,450,'Immediate Head/ Manager',7.4)}
    ${sv(s.received,424,191,450,7.4)}${sline(424,191,450,'Human Resources',7.4)}
  </div>
  ${copyLabel(80, top+H+5, copy, req.ref_no)}`;
}

/* ---------- OFFICIAL BUSINESS ---------- */
function pOB(d, top, copy){
  const W=715, H=489, cols=[89,90,89,90,90,267], rh=108/7, s=sigs(d), req=d.req;
  let body='';
  for(let i=0;i<7;i++){

function renderLogin(mode='in', note=''){
  document.body.classList.remove('app');

    <div class="brand"><img src="${window.DEFAULT_LOGO}" alt=""><div>HR Process Forms<small>Leave · OT · Undertime · OB · Attendance</small></div></div>

      </div>`}
  </div></div>`;
  $$('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();renderLogin(a.dataset.m);});
  const msg=(t,k='err')=>$('#lmsg').innerHTML=`<div class="msg ${k}">${esc(t)}</div>`;
  const go = async ()=>{
    const btn=$('#lgo'); btn.disabled=true;
    try{
      const email=$('#le')?.value.trim().toLowerCase(), pw=$('#lp')?.value;
      if(mode==='in'){ const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; }
      else if(mode==='up'){
        if(!pw || pw.length<8) throw new Error('Use at least 8 characters for the password.');
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
        if(error) throw error;
        if(!data.session) msg('Account created. Check your email to confirm it, then sign in.','ok');
      }
      else if(mode==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw error; msg('If that email has an account, a reset link was sent.','ok'); }
      else if(mode==='reset'){ if(!pw||pw.length<8) throw new Error('Use at least 8 characters.'); const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error; toast('Password updated'); S.recovery=false; location.hash='#/home'; boot(); }
    }catch(e){ msg(errMsg(e).replace('Database error saving new user','Sign-up is limited to @meatplus.ph emails or emails registered by HR.')); }
    finally{ btn.disabled=false; }
  };
  $('#lgo').onclick=go;
  $$('.login input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter') go(); });
}

  if(BOOTING) return; BOOTING=true; try{ await _boot(); } finally { BOOTING=false; }
}
async function _boot(){
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session;
  if(!session){ renderLogin(); return; }
  $('#app').innerHTML = '<div class="login"><span class="spin"></span></div>';

}

async function userFn(body){

function genPw(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz', d='23456789';

  let s=''; for(let i=0;i<7;i++) s+=a[r(a.length)]; for(let i=0;i<3;i++) s+=d[r(d.length)];

}

async function refreshInboxCount(){
  try{
    const rows = await q(sb.from('hrf_approvals').select('id,assignee_id,approver_kind,hrf_requests!inner(status,employee_id)').eq('status','pending').eq('hrf_requests.status','pending'));

function mayAct(a, req){
  if(a.status!=='pending') return false;
  if(req && req.employee_id===S.me.id && !isAdmin()) return false;
  return a.assignee_id===S.me.id || (a.approver_kind==='hr' && isHR());
}

/* ---------- router ---------- */
window.addEventListener('hashchange', ()=>{ if(S.me) route(); });
async function route(){
  const h = location.hash.replace(/^#\/?/,'') || 'home';
  const parts = h.split('/');
  $$('#side a').forEach(a=>a.classList.toggle('on', h===a.dataset.r || (a.dataset.r!=='home' && h.startsWith(a.dataset.r+'/'))));
  $('#side')?.classList.remove('open');
  const m = $('#main'); if(!m) return;
  m.innerHTML = '<span class="spin"></span>';
  try{
    if(parts[0]==='home') await vHome(m);
    else if(parts[0]==='file') await vFile(m, parts[1], parts[2]);
    else if(parts[0]==='my') await vList(m, 'my');
    else if(parts[0]==='inbox') await vInbox(m);
    else if(parts[0]==='req') await vReq(m, parts[1]);
    else if(parts[0]==='reports' && isHR()) await vReports(m);
    else if(parts[0]==='admin' && isHR()) await ({employees:vEmployees, departments:vDepts, routes:vRoutes, leavetypes:vLeaveTypes, companies:vCompanies, users:vUsers}[parts[1]]||vHome)(m);
    else await vHome(m);
  }catch(e){ m.innerHTML = `<div class="msg err">${esc(errMsg(e))}</div>`; }
  window.scrollTo(0,0);
}

/* ---------- file / resubmit ---------- */
const COLS = {
  LEAVE: ['leave_type','with_pay','date_from','date_to','time_from','time_to'],
  OT:    ['date_from','time_from','time_to','reason'],
  UT:    ['date_from','time_from','time_to','reason'],
  OB:    ['date_from','date_to','time_from','time_to','location','reason'],
  COA:   ['date_from','date_to','time_from','time_to','reason'],
};
const COL_LABEL = { leave_type:'Type of leave', with_pay:'With / without pay', date_from:'Date from', date_to:'Date to', time_from:'Time from', time_to:'Time to', location:'Location', reason:'Reason / purpose' };
const COL_LABEL_OT = { date_from:'Date', time_from:'Start time', time_to:'End time', reason:'Reason / purpose' };

async function vFile(m, code, editId){
  const f = formOf(code);
  if(!f || !COLS[code]) { m.innerHTML='<div class="msg err">Unknown form.</div>'; return; }
  let lines=[{}], reason='', existing=null;
  if(editId){
    existing = await q(sb.from('hrf_requests').select('*').eq('id',editId).single());
    if(existing.status!=='returned' || existing.employee_id!==S.me.id){ location.hash='#/req/'+editId; return; }
    lines = await q(sb.from('hrf_request_lines').select('*').eq('request_id',editId).eq('rev',existing.rev).order('line_no'));
    reason = existing.reason||'';
  }
  const cols = COLS[code];
  const labels = (code==='OT'||code==='UT') ? COL_LABEL_OT : COL_LABEL;
  const route = S.routes.filter(r=>r.form_code===code);
  const me = S.emps.find(e=>e.id===S.me.id) || {};
  const routeTxt = route.map(r=>{
    let who = r.approver_kind==='supervisor' ? empName(me.supervisor_id) : r.approver_kind==='dept_head' ? empName((S.depts.find(d=>d.id===me.department_id)||{}).head_employee_id) : r.approver_kind==='specific' ? empName(r.approver_employee_id) : 'HR';
    return `<b>${esc(r.label)}</b> ${esc(who|| '— (skipped: not set)')}`;
  }).join(' &rarr; ');

  const cell = (c, l) => {
    const v = l[c] ?? '';
    if(c==='leave_type') return `<select class="in" data-c="${c}"><option value="">—</option>${S.leaveTypes.filter(x=>x.active).map(x=>`<option value="${esc(x.code)}" ${v===x.code?'selected':''}>${esc(x.code)} – ${esc(x.name)}</option>`).join('')}</select>`;
    if(c==='with_pay') return `<select class="in" data-c="${c}"><option value="true" ${v!==false?'selected':''}>With pay</option><option value="false" ${v===false?'selected':''}>Without pay</option></select>`;
    if(c.startsWith('date')) return `<input class="in" type="date" data-c="${c}" value="${esc(v)}">`;
    if(c.startsWith('time')) return `<input class="in" type="time" data-c="${c}" value="${esc(String(v).slice(0,5))}">`;
    return `<input class="in" data-c="${c}" value="${esc(v)}" maxlength="${c==='location'?60:200}">`;
  };
  const rowHtml = l => `<tr>${cols.map(c=>`<td style="${c==='reason'?'min-width:220px':c==='leave_type'?'min-width:170px':'min-width:120px'}">${cell(c,l)}</td>`).join('')}<td class="calc" style="white-space:nowrap;color:var(--ink-3);font-size:12px"></td><td><button class="btn sm bad" data-del title="Remove row">✕</button></td></tr>`;

  m.innerHTML = `<h1>${esc(f.title)}</h1><p class="sub">${existing?`Revising <b>${esc(existing.ref_no)}</b> — make your changes and resubmit.`:esc(FORM_HINT[code]||'')}</p>
  <div class="card"><h3>Employee</h3>
    <dl class="kv"><dt>Name</dt><dd>${esc(S.me.full_name)}</dd><dt>Position</dt><dd>${esc(S.me.position||'—')}</dd>
    <dt>Department</dt><dd>${esc(S.me.department_name||'—')}</dd><dt>Company</dt><dd>${esc(S.me.company_name)}</dd>
    <dt>Date filed</dt><dd>${fmtD(today())}</dd>${code==='LEAVE'?`<dt>Date hired</dt><dd>${fmtD(S.me.date_hired)||'—'}</dd>`:''}
    <dt>Approval</dt><dd>${routeTxt||'<span style="color:var(--bad)">No route set — contact HR</span>'}</dd></dl>
  </div>
  <div class="card"><div class="row"><h3 style="margin:0">Details</h3><div class="sp"></div><span style="font-size:12px;color:var(--ink-3)">Up to ${f.max_rows} rows</span></div>
    <div class="tw" style="margin-top:10px"><table class="t ed"><thead><tr>${cols.map(c=>`<th>${labels[c]}</th>`).join('')}<th>${code==='OT'||code==='UT'?'Hours':'Days'}</th><th></th></tr></thead><tbody id="rows">${lines.map(rowHtml).join('')}</tbody></table></div>
    <button class="btn sm" id="addrow" style="margin-top:10px">+ Add row</button>
    ${code==='LEAVE'?`<div style="margin-top:14px"><label class="f">Reason</label><textarea class="in" id="reason" maxlength="500">${esc(reason)}</textarea></div>`:''}
  </div>
  <div class="card"><h3>Attachments</h3>
    <p style="margin:0 0 8px;font-size:13px;color:var(--ink-3)">Please attach needed attachment/s${code==='LEAVE'?', example: Medical Certificate':''}. PDF or images, max 10 MB each.</p>
    <input type="file" id="files" multiple accept=".pdf,image/*,.doc,.docx,.xls,.xlsx">
  </div>
  <div class="row" style="margin-top:16px"><div class="sp"></div><a class="btn" href="${existing?'#/req/'+existing.id:'#/home'}">Cancel</a><button class="btn pri" id="submit">${existing?'Resubmit':'Submit'} for approval</button></div>`;

  const tb = $('#rows');
  const calc = () => $$('#rows tr').forEach(tr=>{
    const g=c=>$(`[data-c="${c}"]`,tr)?.value||'';
    const l={date_from:g('date_from'),date_to:g('date_to'),time_from:g('time_from'),time_to:g('time_to')};
    let t='';
    if(code==='OT'||code==='UT'){ const h=hrsOf(l); t=h!=null?h+' h':''; }
    else { const d=daysOf(l); t = d && d>0 ? d+' d' : (d!==null&&d<=0?'⚠ dates':''); }
    $('.calc',tr).textContent=t;
  });
  const wire = () => { $$('[data-del]',tb).forEach(b=>b.onclick=()=>{ if($$('#rows tr').length>1){ b.closest('tr').remove(); calc(); } }); $$('input,select',tb).forEach(i=>i.oninput=calc); };
  wire(); calc();
  $('#addrow').onclick=()=>{
    if($$('#rows tr').length>=f.max_rows) return toast(`Maximum of ${f.max_rows} rows`,true);
    const last=$$('#rows tr').pop(); const prev={};
    if(last && code==='LEAVE'){ prev.leave_type=$('[data-c="leave_type"]',last).value; prev.with_pay=$('[data-c="with_pay"]',last).value==='true'; }
    if(last && (code==='OT'||code==='UT')){ prev.time_from=$('[data-c="time_from"]',last).value; prev.time_to=$('[data-c="time_to"]',last).value; }
    tb.insertAdjacentHTML('beforeend', rowHtml(prev)); wire(); calc();
  };
  $('#submit').onclick = async ()=>{
    const out = $$('#rows tr').map(tr=>{ const o={}; $$('[data-c]',tr).forEach(i=>o[i.dataset.c]= i.dataset.c==='with_pay' ? i.value==='true' : i.value.trim()); return o; })
      .filter(o=>o.date_from || o.date_to || o.reason || o.location);
    if(!out.length) return toast('Please fill in at least one row.', true);
    const files=[...$('#files').files];
    const big=files.find(x=>x.size>10*1024*1024); if(big) return toast(`${big.name} is larger than 10 MB`,true);
    const btn=$('#submit'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Submitting…';
    try{
      const id = await q(sb.rpc('hrf_submit',{ p_form_code:code, p_reason: code==='LEAVE'?$('#reason').value.trim():null, p_lines: out, p_request_id: existing?existing.id:null }));
      await uploadFiles(id, files);
      toast(existing?'Resubmitted':'Submitted for approval');
      location.hash = '#/req/'+id;
    }catch(e){ toast(errMsg(e), true); btn.disabled=false; btn.textContent=(existing?'Resubmit':'Submit')+' for approval'; }
  };
}

async function uploadFiles(reqId, files){
  for(const f of files){
    const safe = f.name.replace(/[^\w.\-]+/g,'_').slice(-80);
    const path = `${reqId}/${Date.now()}_${safe}`;
    const up = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || 'application/octet-stream' });
    if(up.error){ toast(`Upload failed for ${f.name}: ${up.error.message}`, true); continue; }
    const { error } = await sb.from('hrf_attachments').insert({ request_id:reqId, path, file_name:f.name, size_bytes:f.size });
    if(error) toast(`Could not record ${f.name}: ${error.message}`, true);
  }
}

function lineSummary(l){
  const dr = l.date_to && l.date_to!==l.date_from ? `${fmtD(l.date_from)}–${fmtD(l.date_to)}` : fmtD(l.date_from);
  const tr = l.time_from ? ` ${pTime(l.time_from)}–${pTime(l.time_to)}` : '';
  return esc([l.leave_type ? `${l.leave_type}${l.with_pay===false?' (w/o pay)':''}` : '', dr + tr, l.location||'', l.reason||''].filter(Boolean).join(' · '));
}

/* ---------- request detail ---------- */
async function loadReqData(id){
  const req = await q(sb.from('hrf_requests').select('*').eq('id',id).single());
  const [lines, approvals, acts, atts] = await Promise.all([
    q(sb.from('hrf_request_lines').select('*').eq('request_id',id).eq('rev',req.rev).order('line_no')),
    q(sb.from('hrf_approvals').select('*').eq('request_id',id).eq('rev',req.rev).order('step_no')),
    q(sb.from('hrf_activity').select('*').eq('request_id',id).order('id')),
    q(sb.from('hrf_attachments').select('*').eq('request_id',id).eq('active',true).order('created_at')),
  ]);
  const company = S.companies.find(c=>c.id===req.company_id) || {name:'',address:''};
  return { req, lines, approvals, acts, atts, company, form: formOf(req.form_code), leaveTypes: S.leaveTypes };
}

  <div class="grid" style="align-items:start;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)" id="dgrid">

function parseCSV(t){
  const rows=[]; let r=[], f='', qt=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(qt){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else qt=false; } else f+=c; }
    else if(c==='"') qt=true; else if(c===','){ r.push(f); f=''; } else if(c==='\n'){ r.push(f); rows.push(r); r=[]; f=''; } else if(c!=='\r') f+=c; }
  if(f||r.length){ r.push(f); rows.push(r); }
  return rows.filter(x=>x.some(v=>v.trim()));
}
function importEmployees(){
  modal(`<h3>Import employees (CSV)</h3>
  <p style="font-size:13px">Columns (header row required): <code>full_name, email, emp_no, position, company_code, department, date_hired, supervisor_email</code>. Company codes: ${S.companies.map(c=>esc(c.code)).join(', ')}. Dates as YYYY-MM-DD. Existing employees (same email) are updated; new departments are created automatically.</p>
  <button class="btn sm" id="tpl">Download template</button>
  <div style="height:10px"></div><input type="file" id="csv" accept=".csv,text/csv"><div id="imsg" style="font-size:13px;margin-top:10px"></div>
  <div class="acts"><button class="btn" data-close>Close</button><button class="btn pri" id="go" disabled>Import</button></div>`, (mm, close)=>{
    let rows=[];
    $('#tpl',mm).onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['full_name,email,emp_no,position,company_code,department,date_hired,supervisor_email\r\nJuan Dela Cruz,juan.delacruz@meatplus.ph,MTC-001,Accounting Staff,MTC,Accounting,2022-03-01,maria.santos@meatplus.ph\r\n'],{type:'text/csv'})); a.download='employees_template.csv'; a.click(); };
    $('#csv',mm).onchange=async ev=>{
      const t=await ev.target.files[0].text(); const all=parseCSV(t.replace(/^﻿/,''));
      const h=all.shift().map(x=>x.trim().toLowerCase());
      rows=all.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
      const bad=rows.filter(r=>!r.full_name||!r.email||!S.companies.find(c=>c.code.toLowerCase()===(r.company_code||'').toLowerCase()));
      $('#imsg',mm).innerHTML=`${rows.length} row(s) read.${bad.length?` <span style="color:var(--bad)">${bad.length} row(s) missing name/email or have an unknown company code — they will be skipped.</span>`:''}`;
      $('#go',mm).disabled=!rows.length;
    };
    $('#go',mm).onclick=async()=>{
      const btn=$('#go',mm); btn.disabled=true; let ok=0, fail=0; const errs=[];
      for(const r of rows){
        try{
          const co=S.companies.find(c=>c.code.toLowerCase()===(r.company_code||'').toLowerCase()); if(!co||!r.full_name||!r.email) throw new Error('missing data');
          let dept=null;
          if(r.department){ dept=S.depts.find(d=>d.company_id===co.id&&d.name.toLowerCase()===r.department.toLowerCase());
            if(!dept){ dept=await q(sb.from('hrf_departments').insert({company_id:co.id,name:r.department}).select().single()); S.depts.push(dept); } }
          const rec={ full_name:r.full_name, email:r.email.toLowerCase(), emp_no:r.emp_no||null, position:r.position||'', company_id:co.id, department_id:dept?.id||null, date_hired:r.date_hired||null };
          const ex=S.emps.find(e=>(e.email||'').toLowerCase()===rec.email);
          if(ex) await q(sb.from('hrf_employees').update(rec).eq('id',ex.id)); else { const n=await q(sb.from('hrf_employees').insert({...rec,active:true}).select().single()); S.emps.push(n); }
          ok++;
        }catch(e){ fail++; errs.push(`${r.email||r.full_name}: ${errMsg(e)}`); }
        $('#imsg',mm).textContent=`Imported ${ok}, failed ${fail}…`;
      }
      await loadRefs();
      let sup=0;
      for(const r of rows.filter(r=>r.supervisor_email)){
        const e=S.emps.find(x=>(x.email||'').toLowerCase()===r.email.toLowerCase()), s=S.emps.find(x=>(x.email||'').toLowerCase()===r.supervisor_email.toLowerCase());
        if(e&&s&&e.supervisor_id!==s.id){ try{ await q(sb.from('hrf_employees').update({supervisor_id:s.id}).eq('id',e.id)); sup++; }catch(x){ errs.push(`${r.email} supervisor: ${errMsg(x)}`);} }
        else if(e&&!s) errs.push(`${r.email}: supervisor ${r.supervisor_email} not found`);
      }
      $('#imsg',mm).innerHTML=`<div class="msg ok">Done: ${ok} imported/updated, ${sup} supervisor link(s) set, ${fail} failed.</div>${errs.length?`<div class="msg err" style="max-height:140px;overflow:auto">${errs.map(esc).join('<br>')}</div>`:''}`;
      await loadRefs(); route();
    };
  });
}

/* ---------- HR: departments ---------- */
async function vDepts(m){

  const form = d => modal(`<h3>${d.id?'Edit':'Add'} department</h3>
    <label class="f">Company</label><select class="in" id="d-co" ${d.id?'disabled':''}>${S.companies.map(c=>`<option value="${c.id}" ${c.id===d.company_id?'selected':''}>${esc(c.code)} – ${esc(c.name)}</option>`).join('')}</select>
    <div style="height:10px"></div><label class="f">Name</label><input class="in" id="d-name" value="${esc(d.name||'')}">
    <div style="height:10px"></div><label class="f">Department head</label><select class="in" id="d-head"><option value="">—</option>${S.emps.filter(e=>e.active).map(e=>`<option value="${e.id}" ${e.id===d.head_employee_id?'selected':''}>${esc(e.full_name)} — ${esc(e.position)}</option>`).join('')}</select>
    <div style="height:10px"></div><label class="f">Status</label><select class="in" id="d-act"><option value="true">Active</option><option value="false" ${d.active===false?'selected':''}>Inactive</option></select>
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="d-save">Save</button></div>`, (mm, close)=>{
      $('#d-save',mm).onclick=async()=>{
        const rec={ name:$('#d-name',mm).value.trim(), head_employee_id:$('#d-head',mm).value||null, active:$('#d-act',mm).value==='true' };
        if(!rec.name) return toast('Name is required',true);
        try{ if(d.id) await q(sb.from('hrf_departments').update(rec).eq('id',d.id)); else await q(sb.from('hrf_departments').insert({...rec, company_id:$('#d-co',mm).value})); close(); toast('Saved'); route(); }catch(e){ toast(errMsg(e),true); }

}

/* ---------- HR: approval routes ---------- */
async function vRoutes(m){
  await loadRefs();
  m.innerHTML = `<h1>Approval routes</h1><p class="sub">Steps run in order. "Approved by" and "Received by" print on the paper form's signature lines. Steps whose approver isn't set for an employee (e.g. no supervisor) are skipped automatically.</p>
  ${S.forms.map(f=>`<div class="card" data-f="${f.code}"><div class="row"><h3 style="margin:0">${esc(f.name)}</h3><div class="sp"></div><button class="btn sm" data-add>+ Step</button><button class="btn sm pri" data-save>Save</button></div><div class="tw" style="margin-top:10px"><table class="t ed"><thead><tr><th>#</th><th>Approver</th><th>Specific person</th><th>Label</th><th>Prints on</th><th></th></tr></thead><tbody></tbody></table></div></div>`).join('')}`;
  const stepRow = s => `<tr><td class="no"></td>
    <td><select class="in" data-k="approver_kind">${Object.entries(KIND_LABEL).map(([k,v])=>`<option value="${k}" ${k===s.approver_kind?'selected':''}>${v}</option>`).join('')}</select></td>
    <td><select class="in" data-k="approver_employee_id"><option value="">—</option>${S.emps.filter(e=>e.active).map(e=>`<option value="${e.id}" ${e.id===s.approver_employee_id?'selected':''}>${esc(e.full_name)}</option>`).join('')}</select></td>
    <td><input class="in" data-k="label" value="${esc(s.label||'Approved by')}"></td>
    <td><select class="in" data-k="print_slot"><option value="">(not printed)</option><option value="approved" ${s.print_slot==='approved'?'selected':''}>Approved by line</option><option value="received" ${s.print_slot==='received'?'selected':''}>Received by line</option></select></td>
    <td><button class="btn sm bad" data-rm>✕</button></td></tr>`;
  $$('[data-f]').forEach(card=>{
    const code=card.dataset.f, tb=$('tbody',card);
    const renum=()=>$$('tr',tb).forEach((tr,i)=>{ $('.no',tr).textContent=i+1; const k=$('[data-k="approver_kind"]',tr).value; $('[data-k="approver_employee_id"]',tr).disabled = k!=='specific'; });
    const wire=()=>{ $$('[data-rm]',tb).forEach(b=>b.onclick=()=>{ b.closest('tr').remove(); renum(); }); $$('select',tb).forEach(s=>s.onchange=renum); };
    tb.innerHTML = S.routes.filter(r=>r.form_code===code).map(stepRow).join(''); wire(); renum();
    $('[data-add]',card).onclick=()=>{ tb.insertAdjacentHTML('beforeend', stepRow({approver_kind:'dept_head',label:'Approved by'})); wire(); renum(); };
    $('[data-save]',card).onclick=async()=>{
      const steps=$$('tr',tb).map(tr=>Object.fromEntries($$('[data-k]',tr).map(i=>[i.dataset.k,i.value])));
      try{ await q(sb.rpc('hrf_save_route',{p_form_code:code,p_steps:steps})); toast(`${formOf(code).name} route saved`); await loadRefs(); }catch(e){ toast(errMsg(e),true); }
    };
  });
}

/* ---------- HR: companies ---------- */
async function vCompanies(m){
  await loadRefs();
  m.innerHTML = `<div class="row"><div><h1>Companies</h1><p class="sub" style="margin:0">Name, address and logo print on the form header for that company's employees.</p></div><div class="sp"></div>${isAdmin()?'<button class="btn pri" id="add">+ Add company</button>':''}</div>
  <div class="grid g2" style="margin-top:14px">${S.companies.map(c=>`<div class="card click" data-c="${c.id}" style="cursor:pointer"><div class="row"><img src="${c.logo||window.DEFAULT_LOGO}" style="width:40px;height:40px;object-fit:contain"><div><b>${esc(c.name)}</b><br><small style="color:var(--ink-3)">${esc(c.code)} · ${esc(c.address||'(no address yet)')}</small></div></div>${c.logo?'':'<div style="font-size:12px;color:var(--ink-3);margin-top:8px">Using default logo</div>'}</div>`).join('')}</div>`;
  const form=c=>modal(`<h3>${c.id?'Edit':'Add'} company</h3>
    <div class="grid g2"><div><label class="f">Code</label><input class="in" id="c-code" value="${esc(c.code||'')}" ${c.id?'disabled':''}></div><div></div>
    <div style="grid-column:1/-1"><label class="f">Name (as printed)</label><input class="in" id="c-name" value="${esc(c.name||'')}"></div>
    <div style="grid-column:1/-1"><label class="f">Address (as printed)</label><input class="in" id="c-addr" value="${esc(c.address||'')}"></div>
    <div style="grid-column:1/-1"><label class="f">Logo (PNG/JPG, resized automatically)</label><div class="row"><img id="c-prev" src="${c.logo||window.DEFAULT_LOGO}" style="width:48px;height:48px;object-fit:contain;border:1px solid var(--line);border-radius:6px"><input type="file" id="c-logo" accept="image/*"><button class="btn sm" id="c-def">Use default</button></div></div></div>
    <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="c-save">Save</button></div>`,(mm,close)=>{
      let logo=c.logo||null;
      $('#c-def',mm).onclick=()=>{ logo=null; $('#c-prev',mm).src=window.DEFAULT_LOGO; };
      $('#c-logo',mm).onchange=async ev=>{ const f=ev.target.files[0]; if(!f) return; logo=await resizeImg(f,240); $('#c-prev',mm).src=logo; };
      $('#c-save',mm).onclick=async()=>{
        const rec={ name:$('#c-name',mm).value.trim(), address:$('#c-addr',mm).value.trim(), logo };
        if(!rec.name) return toast('Name is required',true);
        try{ if(c.id) await q(sb.from('hrf_companies').update(rec).eq('id',c.id)); else await q(sb.from('hrf_companies').insert({...rec, code:$('#c-code',mm).value.trim().toUpperCase()})); close(); toast('Saved'); await loadRefs(); route(); }catch(e){ toast(errMsg(e),true); }
      };
    });
  $('#add') && ($('#add').onclick=()=>form({}));
  $$('[data-c]').forEach(el=>el.onclick=()=>form(S.companies.find(c=>c.id===el.dataset.c)));
}
function resizeImg(file, max){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL('image/png')); }; img.onerror=rej; img.src=URL.createObjectURL(file); });
}

/* ---------- start ---------- */
let BOOTING=false;
sb.auth.onAuthStateChange((event, session)=>{
  if(event==='PASSWORD_RECOVERY'){ S.recovery=true; renderLogin('reset','Enter a new password for your account.'); return; }
  if(event==='SIGNED_IN' && !S.me && !BOOTING && !S.recovery) setTimeout(boot,0);
  if(event==='SIGNED_OUT'){ S.me=null; S.session=null; renderLogin(); }
});
boot();

</script>
